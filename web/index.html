<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaabil voice prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Figtree:wght@400;500;600&family=Hind:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#fafafa; --panel2:#f4f4f5; --line:#e7e7e9; --line2:#d4d4d8;
  --ink:#111113; --dim:#5b5b63; --faint:#8e8e96;
  --gold:#b45309; --teal:#047857; --coral:#b91c1c; --sky:#1d4ed8;
  --serif:"IBM Plex Sans","Hind","Segoe UI",sans-serif; --body:"IBM Plex Sans","Hind","Nirmala UI","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:#dbeafe;color:#111}

header{display:flex;align-items:flex-end;gap:28px;padding:22px 32px 0;border-bottom:1px solid var(--line)}
.brand{padding-bottom:14px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0;line-height:1.2}
.brand h1 i{font-style:normal;color:var(--dim);font-weight:400}
.brand p{margin:5px 0 0;color:var(--dim);font-size:12.5px;font-family:var(--mono);letter-spacing:.02em}
nav{display:flex;gap:2px;margin-left:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 18px 13px;color:var(--dim);
  font-family:var(--body);font-size:14px;letter-spacing:0}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}

main{display:none;padding:26px 32px 80px;max-width:1500px;margin:0 auto}
main.on{display:block}

/* ------- shared rows and players ------- */
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-bottom:16px}
.seg button{flex:1;background:none;border:0;padding:8px 6px;color:var(--dim);font-weight:600;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.rows{margin-top:22px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:210px 1fr 250px;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.who .nm{font-weight:600;font-size:15.5px;line-height:1.25}
.who .vc{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.tag.local{color:var(--teal);border-color:rgba(84,214,184,.4)}
.tag.cloud{color:var(--sky);border-color:rgba(127,183,255,.4)}
.tag.exp{color:var(--coral);border-color:rgba(255,111,89,.5)}
.player{display:flex;align-items:center;gap:12px;min-width:0;padding-right:52px}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--c,var(--gold));background:none;color:var(--c,var(--gold));
  display:grid;place-items:center;transition:.15s}
.play:hover{background:var(--c,var(--gold));color:#fff}
.play.playing{background:var(--c,var(--gold));color:#fff}
.play svg{width:15px;height:15px;fill:currentColor}
.lane{flex:1;min-width:0;position:relative;height:56px;background:
  repeating-linear-gradient(90deg,transparent 0 calc(var(--sec) - 1px),rgba(255,255,255,.045) calc(var(--sec) - 1px) var(--sec))}
.wave{position:absolute;left:0;top:0;height:100%;cursor:pointer;border-right:1px solid var(--line2)}
.wave canvas{width:100%;height:100%;display:block}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);left:0;opacity:0;pointer-events:none}
.dur{position:absolute;top:2px;font-family:var(--mono);font-size:10.5px;color:var(--faint);padding-left:6px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.chips b{color:var(--ink);font-weight:600}
.chips .good b{color:var(--teal)} .chips .mid b{color:var(--gold)} .chips .bad b{color:var(--coral)}
.asr{margin-top:8px;font-size:13.5px;color:var(--dim);border-left:2px solid var(--line2);padding-left:10px}
.asr span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block}
.err{color:var(--coral);font-family:var(--mono);font-size:12px}
.hint{color:var(--faint);font-size:12.5px;margin-top:14px;max-width:900px}
/* ------- live ------- */
.bench{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:34px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 10px}
textarea{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:12px;font-size:16px;line-height:1.55;resize:vertical}
.ctl{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin:12px 0;font-size:13px;color:var(--dim)}
.ctl label{display:flex;align-items:center;gap:8px}
.ctl output{font-family:var(--mono);color:var(--gold);min-width:42px}
input[type=range]{accent-color:var(--gold);width:140px}
input[type=checkbox]{accent-color:var(--gold)}
select{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;max-width:190px}
.eng{display:grid;grid-template-columns:20px 1fr 170px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.eng.off{opacity:.45}
.eng small{display:block;color:var(--faint);font-size:11.5px;font-family:var(--mono)}
.go{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 20px;font-weight:500;font-size:14px;margin-top:14px}
.go:hover{filter:brightness(1.08)} .go:disabled{opacity:.5;cursor:wait}
.mini{background:none;border:1px solid var(--line2);border-radius:6px;padding:3px 10px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.mini:hover{color:var(--gold);border-color:var(--gold)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

/* ------- headings and tables ------- */
h2.sec{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:-.015em;margin:34px 0 4px}
h2.sec:first-child{margin-top:0}
p.lede{color:var(--dim);max-width:900px;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line2);font-weight:400;vertical-align:bottom}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);white-space:nowrap}
td b{font-weight:600}
td small{color:var(--dim);display:block;font-size:12px}
.empty{color:var(--dim);padding:40px 0;font-family:var(--mono);font-size:13px}
@media(max-width:1100px){.split,.bench{grid-template-columns:1fr}.side{position:static}.row{grid-template-columns:1fr}}
</style>

</head>
<body>
<header>
  <div class="brand">
    <h1>Kaabil AI <i>voice</i></h1>
    <p>English · हिन्दी · मराठी</p>
  </div>
  <nav id="nav">
    <button data-tab="talk" class="on">Conversation</button>
    <button data-tab="live">Live bench</button>
  </nav>
</header>

<main id="talk" class="on"></main>
<main id="live"></main>

<script>
const LANGS = {en:"English", hi:"हिन्दी", mr:"मराठी"};
const HUES = {piper:"#047857", kokoro:"#b45309", supertonic:"#6d28d9", mms:"#c2410c", kitten:"#be185d", edge:"#1d4ed8",
  "kokoro-int8":"#a16207", "supertonic-int8":"#7c3aed", elevenlabs:"#111113", sarvam:"#15803d", "indic-tts":"#0e7490", "indic-parler":"#92400e"};
const S = {st:null, live:[], liveSel:{}, liveLang:"hi"};
const ICON = {play:'<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>', pause:'<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>'};

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v; else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="style") e.style.cssText=v; else e.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat(Infinity)){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
const eng = id => S.st.engines.find(e=>e.id===id);
const pct = x => (x*100).toFixed(0)+"%";
async function post(url, body){
  const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail||r.statusText);
  return j;
}

/* ---------------- audio + waveform ---------------- */
let actx, current=null; const peaksCache = new Map();
async function peaks(url){
  if(peaksCache.has(url)) return peaksCache.get(url);
  const p = (async()=>{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const buf = await actx.decodeAudioData(await (await fetch(url)).arrayBuffer());
    const N = 900, out = new Float32Array(N*2), step = buf.length/N;
    const chans = Array.from({length:buf.numberOfChannels},(_,i)=>buf.getChannelData(i));
    for(let i=0;i<N;i++){
      let lo=0,hi=0; const a=Math.floor(i*step), b=Math.min(buf.length,Math.floor((i+1)*step));
      for(let j=a;j<b;j+=2){ let v=0; for(const c of chans) v+=c[j]; v/=chans.length; if(v<lo)lo=v; if(v>hi)hi=v; }
      out[2*i]=lo; out[2*i+1]=hi;
    }
    return {pk:out, dur:buf.duration};
  })();
  peaksCache.set(url,p); return p;
}
async function draw(canvas, url, color){
  try{
    const {pk} = await peaks(url);
    const dpr = window.devicePixelRatio||1, w = canvas.clientWidth, hgt = canvas.clientHeight;
    if(!w) return;
    canvas.width=w*dpr; canvas.height=hgt*dpr;
    const g = canvas.getContext("2d"); g.scale(dpr,dpr); g.fillStyle=color;
    const N = pk.length/2, mid=hgt/2, bar=Math.max(1,w/N);
    for(let x=0;x<w;x+=2){
      const i=Math.min(N-1,Math.floor(x/w*N));
      const top=mid-pk[2*i+1]*mid*1.9, bot=mid-pk[2*i]*mid*1.9;
      g.fillRect(x,Math.min(top,mid-.5),1.4,Math.max(1,bot-top));
    }
  }catch(e){ console.warn("waveform",url,e); }
}
function player(url, dur, maxDur, color){
  const audio = new Audio(); audio.preload="none"; audio.src=url;
  const btn = h("button",{class:"play",style:`--c:${color}`,html:ICON.play,title:"Play / pause"});
  const cur = h("div",{class:"cursor"});
  const canvas = h("canvas");
  const w = Math.max(4, dur/maxDur*100);
  const wave = h("div",{class:"wave",style:`width:${w}%`}, canvas, cur);
  const lane = h("div",{class:"lane",style:`--sec:${100/maxDur}%`}, wave,
    h("span",{class:"dur",style:`left:${w}%`}, dur.toFixed(1)+" s"));
  let raf;
  const place=()=>{ cur.style.left=(audio.currentTime/(audio.duration||dur)*100)+"%"; };
  const tick=()=>{ place(); raf=requestAnimationFrame(tick); };
  audio.addEventListener("timeupdate",place);
  const stop=()=>{ audio.pause(); };
  audio.addEventListener("play",()=>{ if(current&&current!==stop) current(); current=stop; btn.innerHTML=ICON.pause; btn.classList.add("playing"); cur.style.opacity=1; tick(); });
  audio.addEventListener("pause",()=>{ btn.innerHTML=ICON.play; btn.classList.remove("playing"); cancelAnimationFrame(raf); });
  audio.addEventListener("ended",()=>{ cur.style.opacity=0; audio.currentTime=0; });
  btn.onclick=()=> audio.paused ? audio.play() : audio.pause();
  wave.onclick=e=>{ const r=wave.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*(audio.duration||dur); if(audio.paused) audio.play(); };
  setTimeout(()=>draw(canvas,url,color),0);
  return h("div",{class:"player"}, btn, lane);
}

/* ---------------- shared row ---------------- */
function chips(c, refCer){
  const out=[];
  if(c.rtf!=null){ const x=1/c.rtf; out.push(h("span",{class:x>=3?"good":x>=1.2?"mid":"bad",title:`Generated ${c.duration}s of audio in ${c.gen_time}s on this laptop's CPU. Below 1x means the listener waits longer than the audio lasts.`}, h("b",{},x>=10?x.toFixed(0):x.toFixed(1),"x")," real time")); }
  if(c.cer!=null){ const cls=c.cer<.08?"good":c.cer<.2?"mid":"bad"; out.push(h("span",{class:cls,title:"Whisper heard this clip and its transcript differs from the script by this share of characters. Lower is clearer."+(refCer!=null?` Cloud reference on this sentence: ${pct(refCer)}.`:"")}, "ASR error ",h("b",{},pct(c.cer)))); }
  if(c.f0_std_st!=null) out.push(h("span",{title:"Pitch movement in semitones (standard deviation). Under ~2 tends to sound flat; 3-5 is lively."}, "pitch ±",h("b",{},c.f0_std_st)," st"));
  if(c.pause_count!=null) out.push(h("span",{title:"Silences of 150 ms or longer inside the clip"}, h("b",{},c.pause_count)," pauses · ",c.pause_total,"s"));
  if(c.bandwidth_hz) out.push(h("span",{title:"Highest frequency carrying real energy. 8 kHz sounds like a phone line; 11 kHz+ sounds open."}, h("b",{},(c.bandwidth_hz/1000).toFixed(1))," kHz"));
  if(c.distinct_voices) out.push(h("span",{class:c.distinct_voices>=c.speakers?"good":"bad",title:"Different voices available for the speakers in this conversation"}, h("b",{},c.distinct_voices),"/",c.speakers," voices"));
  return h("div",{class:"chips"}, out);
}

/* ---------------- LIVE ---------------- */
const PRESETS = {
  hi:[["Form help","कृपया अपना मोबाइल नंबर बताइए। मैं उसे फ़ॉर्म में भर दूँगी।"],["Dialogue","A: नमस्ते, मुझे नौकरी के बारे में पूछना था।\nB: जी बोलिए, कौन सी नौकरी?\nA: वही इलेक्ट्रीशियन वाली, पुणे में।\nC: अरे सुनो, पहले पूछो फ़ीस तो नहीं लगेगी!"]],
  mr:[["Form help","कृपया तुमचा मोबाईल नंबर सांगा. मी तो फॉर्ममध्ये भरते."],["Dialogue","A: नमस्कार, मला नोकरीबद्दल विचारायचं होतं.\nB: हो बोला, कोणती नोकरी?\nA: तीच इलेक्ट्रिशियनची, पुण्यातली.\nC: अहो ऐका, आधी विचारा फी तर लागणार नाही ना!"]],
  en:[["Form help","Please tell me your mobile number. I will fill it in the form for you."],["Dialogue","A: Hello, I wanted to ask about the job.\nB: Yes, tell me, which job?\nA: The electrician one, in Pune.\nC: Hey listen, first ask if there is any fee!"]],
};
function renderLive(){
  const root=document.getElementById("live"); root.innerHTML="";
  const L=S.liveLang;
  const ta=h("textarea",{id:"ltext",placeholder:"Type or paste anything: a form field label, an SMS, a government reply…"}, S.liveText ?? PRESETS[L][0][1]);
  ta.addEventListener("input",()=>S.liveText=ta.value);
  const speed=h("input",{type:"range",min:"0.6",max:"1.6",step:"0.05",value:S.liveSpeed||1});
  const so=h("output",{},(+speed.value).toFixed(2)+"x"); speed.oninput=()=>{S.liveSpeed=+speed.value;so.textContent=(+speed.value).toFixed(2)+"x";};
  const dlg=h("input",{type:"checkbox",checked:S.liveDlg});
  const ov=h("input",{type:"range",min:"-0.4",max:"2",step:"0.1",value:S.liveOv??0.8});
  const oo=h("output",{},(+ov.value).toFixed(1)+"s"); ov.oninput=()=>{S.liveOv=+ov.value;oo.textContent=(+ov.value).toFixed(1)+"s";};
  dlg.onchange=()=>{S.liveDlg=dlg.checked; if(dlg.checked&&!/^\s*[A-E]\s*:/m.test(ta.value)){ta.value=PRESETS[L][1][1];S.liveText=ta.value;}};
  const engs=S.st.engines.filter(e=>e.voices[L]);
  const list=engs.map(e=>{
    const sel=S.liveSel[e.id] ?? (S.liveSel[e.id]={on:e.available&&e.in_matrix,voice:{}});
    const cb=h("input",{type:"checkbox",checked:sel.on&&e.available,disabled:!e.available,onchange:ev=>sel.on=ev.target.checked});
    const vs=h("select",{disabled:!e.available,onchange:ev=>sel.voice[L]=ev.target.value}, e.voices[L].map(v=>h("option",{value:v.id,selected:sel.voice[L]===v.id},`${v.label} · ${v.gender}`)));
    return h("div",{class:"eng"+(e.available?"":" off")}, cb, h("div",{}, e.name, e.experimental.includes(L)&&h("span",{class:"tag exp",style:"margin-left:8px"},"experimental"), h("small",{}, e.available? `${e.kind}${e.disk_mb[L]?" · "+Math.round(e.disk_mb[L])+" MB":""}` : e.unavailable_reason)), vs);
  });
  const go=h("button",{class:"go"},"Synthesise");
  const results=h("div",{class:"rows",style:"margin-top:0"});
  const paint=()=>{ results.innerHTML="";
    if(!S.live.length){ results.append(h("div",{class:"empty"},"Results appear here. Tick the engines you want, type a sentence, press Synthesise.")); return; }
    const maxDur=Math.max(4,...S.live.filter(c=>c.url).map(c=>c.duration))*1.06;
    for(const c of S.live){
      const e=eng(c.engine);
      const who=h("div",{class:"who"}, h("div",{class:"nm"},e.name), h("div",{class:"vc"},c.voiceLabel||""), h("div",{class:"tags"},h("span",{class:"tag "+e.kind},e.kind)));
      if(!c.url){ results.append(h("div",{class:"row",style:"grid-template-columns:210px 1fr"}, who, h("div",{class:"err"},c.error||"working…"))); continue; }
      const asrBox=h("div");
      if(c.asr_text) asrBox.append(h("div",{class:"asr"},h("span",{},"what whisper heard"+(c.cer!=null?` · error ${pct(c.cer)}`:"")),c.asr_text));
      else asrBox.append(h("button",{class:"mini",style:"margin-top:8px",title:"Runs Whisper on this clip. First use loads a 1.6 GB model (about 20 s).",onclick:async ev=>{
        ev.target.disabled=true; ev.target.textContent="listening…";
        try{ Object.assign(c, await post("/api/transcribe",{file:c.file,lang:c.lang,reference:c.dialogue?"":c.text})); }catch(x){ c.asr_text="ASR failed: "+x.message; }
        paint(); }},"check with Whisper"));
      results.append(h("div",{class:"row",style:"grid-template-columns:210px 1fr"}, who, h("div",{style:"min-width:0"}, player(c.url,c.duration,maxDur,HUES[c.engine]||"#ccc"), chips(c), asrBox)));
    }};
  go.onclick=async()=>{
    const picks=engs.filter(e=>e.available&&S.liveSel[e.id].on);
    if(!picks.length||!ta.value.trim()) return;
    go.disabled=true; S.live=[];
    for(const e of picks){
      const voice=S.liveSel[e.id].voice[L]||e.voices[L][0].id;
      const slot={engine:e.id,lang:L,text:ta.value,dialogue:dlg.checked,voiceLabel:dlg.checked?"multi-voice mix":voice}; S.live.push(slot); paint();
      go.textContent=`Synthesising ${e.name}…`;
      try{ Object.assign(slot, await post("/api/synth",{engine:e.id,lang:L,text:ta.value,voice,speed:+speed.value,dialogue:dlg.checked,overlap:+ov.value})); }
      catch(x){ slot.error=x.message; }
      paint();
    }
    go.disabled=false; go.textContent="Synthesise";
  };
  root.append(h("div",{class:"bench"},
    h("div",{class:"card"}, h("h3",{},"Your text"),
      h("div",{class:"seg"}, Object.entries(LANGS).map(([k,v])=>h("button",{class:L===k?"on":"",onclick:()=>{S.liveLang=k;S.liveText=null;renderLive();}},v))),
      h("div",{class:"presets"}, PRESETS[L].map(([n,t])=>h("button",{class:"mini",onclick:()=>{ta.value=t;S.liveText=t;dlg.checked=n==="Dialogue";S.liveDlg=dlg.checked;}},n)),
        (S.st.questions[L]||[]).slice(0,6).map((q,i)=>h("button",{class:"mini",title:q,onclick:()=>{ta.value=q;S.liveText=q;dlg.checked=false;S.liveDlg=false;}},"Question "+(i+1)))),
      ta,
      h("div",{class:"ctl"}, h("label",{},"speed",speed,so), h("label",{title:"Write lines as  A: …  B: …  C: …  Each speaker gets a different voice."},dlg,"dialogue mix"), h("label",{title:"How long each turn starts before the previous one ends. Negative = polite gap."},"overlap",ov,oo)),
      h("h3",{style:"margin-top:8px"},"Engines"), list, go),
    h("div",{}, h("h2",{class:"sec"},"Output"), h("p",{class:"lede"},"Timing is measured on this machine. Local engines run entirely offline; cloud engines send the text to their provider."), results)));
  paint();
}

/* ---------------- boot ---------------- */
const RENDER={live:renderLive};
document.getElementById("nav").addEventListener("click",async e=>{
  const t=e.target.dataset.tab; if(!t) return;
  if(current) current();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===e.target));
  document.querySelectorAll("main").forEach(m=>m.classList.toggle("on",m.id===t));
  RENDER[t]();
});
(async()=>{
  try{ S.st=await (await fetch("/api/state")).json(); renderTalk(); }
  catch(e){ document.getElementById("listen").append(h("div",{class:"empty"},"Could not reach the rig server: "+e.message)); }
})();
</script>
